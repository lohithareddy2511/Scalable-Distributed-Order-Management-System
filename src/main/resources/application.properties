# ========================
# Application Configuration
# ========================
spring.application.name=order-management-system

# ========================
# Server Configuration
# ========================
server.port=9090
server.servlet.context-path=/api

# ========================
# PostgreSQL Database Configuration
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/order_management_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ========================
# JPA / Hibernate Configuration
# ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ========================
# Flyway Migration Configuration
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ========================
# Logging Configuration
# ========================
logging.level.root=INFO
logging.level.com.ordermanagement=DEBUG
logging.level.org.springframework.transaction=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/order-management.log
logging.file.max-size=10MB
logging.file.max-history=30

# ========================
# Actuator / Monitoring
# ========================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true

# ========================
# OpenAPI / Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ========================
# Application Custom Properties
# ========================
app.order.max-items-per-order=50
app.order.default-page-size=20
app.order.payment-timeout-minutes=30
